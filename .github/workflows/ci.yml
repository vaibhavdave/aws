name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Fast signal: every module's unit tests, plus building every jar (needed below)
      # and Module 10's CDK synthesis test (no Docker required for that one).
      - name: Unit tests and package
        run: mvn -B clean verify

      # Module 09's ECS demo schedules this image by tag - there's no registry in this
      # repo's local workflow, so it has to exist as a local Docker image before the
      # ECS-tagged integration test runs.
      - name: Build the Module 09 container image
        run: docker build -t task-tracker-container:latest modules/09-ecs-ec2

      - name: Start Floci
        run: docker compose up -d

      - name: Wait for Floci to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566 >/dev/null; then
              echo "Floci is up"
              exit 0
            fi
            sleep 2
          done
          echo "Floci did not become ready in time"
          docker compose logs
          exit 1

      # Full signal: re-runs unit tests (fast, harmless) plus every module's Floci-tagged
      # integration test - both the Testcontainers-managed ones (Modules 00-04, 11) and the
      # ones that target this docker-compose Floci directly (Modules 05-09, RDS/ElastiCache/
      # Lambda/API Gateway/ECS all needing real Docker networking, per each module's README).
      - name: Integration tests against Floci
        run: mvn -B verify -Pfloci

      - name: Floci logs (always, for debugging)
        if: always()
        run: docker compose logs

      - name: Stop Floci
        if: always()
        run: docker compose down
